apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-q3-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-q3

  template:
    metadata:
      labels:
        app: java-q3

    spec:
      containers:
        - name: java-q3-container
          image: harshya123/jenkins-cicd-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
